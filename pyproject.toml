[project]
name = "ek80-seabed-detection"
version = "1.0.0"
description = "Code for a Master's thesis on U-Net seabed detection in Simrad EK80 echosounder data"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["code/raw_sensor_integration/rsi_bottomdetection"]

[tool.ruff.lint]
select = ["E9", "F"]
